name: Deploy to GitHub Pages
on:
  push:
    branches: [main, data]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # App code from main, generated data from the `data` branch (one commit, replaced on every refresh
      # by scripts/publish_data.py so the repository history does not grow with each data refresh).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - run: mkdir -p public && rm -rf public/data && mv _data/data public/data && rm -rf _data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html
      - run: du -sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
